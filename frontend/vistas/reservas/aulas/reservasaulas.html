<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <!-- PRIMERO: Definir BASE -->
        <script>const BASE = window.location.origin + "/frontend";</script>
        <script>const API = window.location.origin + "/API";</script>

        <!-- Cargar authGuard PRIMERO -->
        <script src="/frontend/javascript/sesion/authGuard.js"></script>

        <!-- En menuadministrador.html y otras páginas de admin -->
        <script>
            const rol = Number(sessionStorage.getItem("rol"));
            
            // Admin (30) y super-admin (40) pueden acceder
            const script1 = document.createElement("script");
            script1.src = BASE + "/javascript/includes.js";
            script1.onload = () => {
                const script2 = document.createElement("script");
                script2.src = BASE + "/javascript/menu.js";
                script2.onload = () => {
                    generarPagina("aulas", rol);
                };
                // posibles: aulas, salonactos, portatiles, espacios, incidencias, liberar, administrador
                document.head.appendChild(script2);
            };
            document.head.appendChild(script1);
        </script>
        <title>Aula - IES Bajo Aragón</title>
    </head>

    <body>

        <div id="header"></div>

        <main class="container mt-5 mb-5">

            <!-- CABECERA -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 id="reservaTitulo">Reserva de aula</h2>
            </div>

            <!-- FORMULARIO -->
            <form id="formReserva" method="post" action="#">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <div class="row g-3">

                            <!-- Aula -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Aula</label>
                                <input type="text" class="form-control" id="reserva_espacio_portatil" name="espacio_portatil" required>
                            </div>

                            <!-- Asignatura -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Asignatura</label>
                                <input type="text" class="form-control" id="reserva_asignatura" name="asignatura" required>
                            </div>

                            <!-- Grupo -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Grupo</label>
                                <input type="text" class="form-control" id="reserva_grupo" name="grupo" required>
                            </div>

                            <!-- Profesor -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Profesor</label>
                                <input type="text" class="form-control" id="reserva_profesor" name="profesor" required>
                            </div>

                            <!-- Inicio -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Inicio</label>
                                <input type="datetime-local" class="form-control" id="reserva_inicio" name="inicio" required>
                            </div>

                            <!-- Fin -->
                            <div class="col-md-6">
                                <label class="text-black form-label">Fin</label>
                                <input type="datetime-local" class="form-control" id="reserva_fin" name="fin" required>
                            </div>

                            <!-- Observaciones -->
                            <div class="col-12">
                                <label class="text-black form-label">Observaciones</label>
                                <textarea class="form-control" id="reserva_observaciones" name="observaciones" rows="3"></textarea>
                            </div>

                        </div>
                    </div>

                    <!-- FOOTER -->
                    <div class="card-footer text-end">
                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>
                    </div>
                </div>
            </form>
            
            <div class="position-fixed bottom-0 end-0 p-3 w-auto me-2 mb-2 me-md-5 mb-md-5" style="z-index:1030; right: 0 !important;">
                <a href="vistasemanal.html"
                class="btn bg-azul text-light rounded-pill px-3 fs-5" style="border: 1px solid #E6F5F0;">
                    <i class="bi bi-caret-left-fill"></i>
                    Volver
                </a>
            </div>
        </main>

        <footer id="footer"></footer>

    </body>
</html>
